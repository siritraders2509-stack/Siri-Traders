name = "siri-traders"
compatibility_date = "2026-09-20"
# nodejs_compat is required for the npm packages reused as-is from the old
# Vercel backend (bcryptjs, jsonwebtoken, cookie, @clerk/backend, drizzle-orm,
# postgres, zod) and for process.env support (see functions/_lib/adapter.js).
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/dist"

# DB access is over Supabase's REST API (db/supabase.js, plain fetch()) —
# no Hyperdrive/Postgres binding needed; it has no query-count ceiling
# unlike Hyperdrive's free-tier 100k/day cap.

# Image uploads go to Supabase Storage (api/upload.js) over plain fetch() —
# no Cloudflare binding needed, just the SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
# env vars below (R2 was dropped: it requires a credit card on file even for
# the free tier, which wasn't acceptable here).

# Plain secrets/vars are set in the Cloudflare Pages dashboard (Settings ->
# Environment variables), separately for Production and Preview — NOT here,
# since this file is committed to the repo. See .env.example for the full
# list.
